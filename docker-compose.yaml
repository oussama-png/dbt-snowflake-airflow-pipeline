x-airflow-common: &airflow-common
  build: .                                   # image Airflow 2.10.2 + dbt (voir Dockerfile)
  image: mon_projet-airflow:2.10.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    DBT_PROJECT_DIR: /opt/airflow/mon_projet   # "dbt run" s'execute sur ce projet
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - airflow-data:/opt/airflow  # <--- Ajoutez cette ligne ici
    - .:/opt/airflow/mon_projet                       # le projet dbt
    - ${USERPROFILE}/.dbt:/home/airflow/.dbt:ro       # profiles.yml (Snowflake)
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # Initialise la base et cree l'utilisateur admin / admin, puis s'arrete
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-data:  # <--- Ajoutez ce bloc tout en bas du fichier
